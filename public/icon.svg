<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with safe-zone margin -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Stars in background -->
  <circle cx="90" cy="110" r="4" fill="#fbbf24" opacity="0.8" />
  <circle cx="420" cy="130" r="5" fill="#38bdf8" opacity="0.9" />
  <circle cx="80" cy="380" r="4" fill="#fde047" opacity="0.8" />
  <circle cx="430" cy="390" r="6" fill="#fbbf24" opacity="0.9" />
  <circle cx="260" cy="80" r="3" fill="#ffffff" opacity="0.7" />

  <!-- Cursive "A" calligraphy loop trail behind the rocket -->
  <path d="M 120 380 C 140 240, 200 160, 260 210 C 310 250, 220 360, 180 340 C 150 320, 220 220, 340 180" 
        fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Rocket Body -->
  <g transform="translate(40, -10)">
    <!-- Rocket exhaust flame -->
    <path d="M 230 310 Q 210 370 250 410 Q 290 370 270 310 Z" fill="url(#flameGrad)" filter="url(#glow)" />
    <path d="M 240 310 Q 230 350 250 380 Q 270 350 260 310 Z" fill="#ffffff" opacity="0.8" />

    <!-- Rocket Fins -->
    <path d="M 215 280 L 175 320 L 225 315 Z" fill="#0284c7" />
    <path d="M 285 280 L 325 320 L 275 315 Z" fill="#0284c7" />

    <!-- Rocket Fuselage -->
    <path d="M 250 140 Q 290 190 285 310 L 215 310 Q 210 190 250 140 Z" fill="#f8fafc" />

    <!-- Rocket Nosecone Tip -->
    <path d="M 250 140 Q 275 175 275 200 L 225 200 Q 225 175 250 140 Z" fill="#ef4444" />

    <!-- Porthole Window -->
    <circle cx="250" cy="235" r="24" fill="#0284c7" stroke="#38bdf8" stroke-width="6" />
    <circle cx="250" cy="235" r="16" fill="#38bdf8" opacity="0.8" />
    <circle cx="244" cy="229" r="6" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Big sparkling golden star -->
  <path d="M 400 90 L 407 108 L 426 111 L 411 123 L 416 141 L 400 131 L 384 141 L 389 123 L 374 111 L 393 108 Z" fill="url(#goldGrad)" filter="url(#glow)" />
</svg>
